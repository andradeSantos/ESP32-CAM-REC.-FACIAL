services:
  api:
    build:
      context: ./pc
      dockerfile: Dockerfile
    container_name: esp32cam-expressoes-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - EXP_HOST=0.0.0.0
      - EXP_PORT=5000
      - EXP_WEB_PASSWORD=${EXP_WEB_PASSWORD:-}
      - EXP_API_KEY=${EXP_API_KEY:-}
      - EXP_ALLOW_LOCAL_NO_KEY=${EXP_ALLOW_LOCAL_NO_KEY:-true}
      - EXP_TRUST_PROXY=${EXP_TRUST_PROXY:-true}
    volumes:
      - ./pc/senha_web.txt:/app/senha_web.txt
      - ./pc/chave_api.txt:/app/chave_api.txt

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: esp32cam-expressoes-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:5000
